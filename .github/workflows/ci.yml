name: pytest

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test on Python ${{ matrix.python-version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13']
      fail-fast: false
      max-parallel: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install UV
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.16"
          python-version: ${{ matrix.python-version }}

      - name: Run tests and collect coverage
        run: uv run pytest --color=yes --disable-pytest-warnings --cov=molharbor --cov-report=xml tests/

      - name: Upload coverage to Codecov
        if: ${{ matrix.os == 'ubuntu-latest' }} && ${{ matrix.python-version == '3.10' }}
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          verbose: true
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}

    env:
      PYTHONIOENCODING: utf-8

  minimum-dependencies:
    name: Test minimum runtime dependencies
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install UV
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.16"
          python-version: '3.10'

      - name: Install minimum runtime dependencies
        run: |
          uv venv --python 3.10
          uv pip install --resolution lowest-direct -e .
          uv pip install "pytest<8" pytest-lazy-fixture==0.6.3

      - name: Run tests
        run: uv run --no-sync pytest --color=yes --disable-pytest-warnings tests/

    env:
      PYTHONIOENCODING: utf-8
